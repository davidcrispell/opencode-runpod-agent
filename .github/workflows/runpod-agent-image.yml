name: Runpod agent image

on:
  workflow_dispatch:
  push:
    branches:
      - runpod-agent
    paths:
      - deploy/runpod-agent/**
      - .github/workflows/runpod-agent-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/opencode-runpod-agent
          tags: |
            type=raw,value=2.2.2-v1
            type=sha,prefix=2.2.2-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/runpod-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
